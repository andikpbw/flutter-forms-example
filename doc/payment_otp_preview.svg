<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
  </defs>

  <rect width="460" height="280" rx="18" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <circle cx="26" cy="26" r="6" fill="#38BDF8"/>
  <text x="40" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC">Luhn Card Brand Detector &amp; 6-Digit OTP</text>
  <text x="436" y="30" font-family="monospace" font-size="10.5" fill="#38BDF8" text-anchor="end">ModernOtpField</text>

  <!-- Credit Card Input -->
  <g transform="translate(24, 54)">
    <text x="0" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#E2E8F0">Credit or Debit Card *</text>
    <rect x="288" y="0" width="56" height="18" rx="5" fill="#4F46E5" fill-opacity="0.25" stroke="#818CF8" stroke-width="1"/>
    <text x="316" y="12.5" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#A5B4FC" text-anchor="middle">💳 VISA</text>

    <rect x="350" y="0" width="62" height="18" rx="5" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <text x="381" y="12.5" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#34D399" text-anchor="middle">LUHN OK</text>

    <rect x="0" y="24" width="412" height="44" rx="11" fill="#131D31" stroke="#38BDF8" stroke-width="1.6"/>
    <text x="18" y="51" font-family="monospace" font-size="15.5" font-weight="800" fill="#F8FAFC" letter-spacing="2.2">4242 4242 4242 4242</text>
    <text x="392" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#10B981" text-anchor="end">✓</text>
  </g>

  <!-- 6-Digit Segmented OTP Boxes -->
  <g transform="translate(24, 154)">
    <text x="0" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#E2E8F0">3D-Secure Verification Code (6-Digit OTP) *</text>
    <rect x="346" y="0" width="66" height="18" rx="5" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <text x="379" y="12.5" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#34D399" text-anchor="middle">VERIFIED</text>

    <g transform="translate(0, 26)">
      <rect x="0" y="0" width="60" height="54" rx="12" fill="#4F46E5" fill-opacity="0.2" stroke="#6366F1" stroke-width="1.6"/>
      <text x="30" y="34" font-family="monospace" font-size="20" font-weight="900" fill="#F8FAFC" text-anchor="middle">8</text>

      <rect x="70" y="0" width="60" height="54" rx="12" fill="#4F46E5" fill-opacity="0.2" stroke="#6366F1" stroke-width="1.6"/>
      <text x="100" y="34" font-family="monospace" font-size="20" font-weight="900" fill="#F8FAFC" text-anchor="middle">4</text>

      <rect x="140" y="0" width="60" height="54" rx="12" fill="#4F46E5" fill-opacity="0.2" stroke="#6366F1" stroke-width="1.6"/>
      <text x="170" y="34" font-family="monospace" font-size="20" font-weight="900" fill="#F8FAFC" text-anchor="middle">9</text>

      <rect x="210" y="0" width="60" height="54" rx="12" fill="#4F46E5" fill-opacity="0.2" stroke="#6366F1" stroke-width="1.6"/>
      <text x="240" y="34" font-family="monospace" font-size="20" font-weight="900" fill="#F8FAFC" text-anchor="middle">2</text>

      <rect x="280" y="0" width="60" height="54" rx="12" fill="#4F46E5" fill-opacity="0.2" stroke="#6366F1" stroke-width="1.6"/>
      <text x="310" y="34" font-family="monospace" font-size="20" font-weight="900" fill="#F8FAFC" text-anchor="middle">0</text>

      <rect x="350" y="0" width="62" height="54" rx="12" fill="#00F5D4" fill-opacity="0.2" stroke="#00F5D4" stroke-width="2">
        <animate attributeName="stroke-opacity" values="1.0;0.3;1.0" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <text x="381" y="34" font-family="monospace" font-size="20" font-weight="900" fill="#00F5D4" text-anchor="middle">4</text>
    </g>
  </g>
</svg>
