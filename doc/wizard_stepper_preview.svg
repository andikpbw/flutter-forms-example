<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="cta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <rect width="460" height="280" rx="18" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <circle cx="26" cy="26" r="6" fill="#A855F7"/>
  <text x="40" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC">3-Step Validated Form Wizard</text>
  <text x="436" y="30" font-family="monospace" font-size="10.5" fill="#C084FC" text-anchor="end">ModernFormStepper</text>

  <!-- Step Indicator Row -->
  <g transform="translate(36, 54)">
    <circle cx="30" cy="16" r="15" fill="#10B981"/>
    <text x="30" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">✓</text>
    <text x="30" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="middle">1. Identity</text>

    <rect x="54" y="14.5" width="114" height="3" rx="1.5" fill="#10B981"/>

    <circle cx="194" cy="16" r="16" fill="#4F46E5" stroke="#00F5D4" stroke-width="2">
      <animate attributeName="r" values="14.5;17;14.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="194" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="194" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#F8FAFC" text-anchor="middle">2. Stack &amp; Scale</text>

    <rect x="218" y="14.5" width="114" height="3" rx="1.5" fill="#334155"/>
    <rect x="218" y="14.5" width="70" height="3" rx="1.5" fill="#00F5D4">
      <animate attributeName="width" values="25;114;25" dur="3s" repeatCount="indefinite"/>
    </rect>

    <circle cx="358" cy="16" r="15" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <text x="358" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#94A3B8" text-anchor="middle">3</text>
    <text x="358" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8" text-anchor="middle">3. Verify OTP</text>
  </g>

  <!-- Choice Chips -->
  <g transform="translate(24, 122)">
    <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#E2E8F0">Target Deployment Platforms (Multi-Select) *</text>
    <g transform="translate(0, 22)">
      <rect x="0" y="0" width="128" height="32" rx="10" fill="#4F46E5" fill-opacity="0.24" stroke="#6366F1" stroke-width="1.5"/>
      <text x="64" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#A5B4FC" text-anchor="middle">📱 iOS &amp; Android ✓</text>

      <rect x="138" y="0" width="132" height="32" rx="10" fill="#00F5D4" fill-opacity="0.16" stroke="#00F5D4" stroke-width="1.5"/>
      <text x="204" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#00F5D4" text-anchor="middle">🌐 Web / WASM ✓</text>

      <rect x="280" y="0" width="132" height="32" rx="10" fill="#4F46E5" fill-opacity="0.24" stroke="#6366F1" stroke-width="1.5"/>
      <text x="346" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#A5B4FC" text-anchor="middle">💻 Desktop OS ✓</text>
    </g>
  </g>

  <!-- Navigation Buttons -->
  <g transform="translate(24, 218)">
    <rect x="0" y="0" width="102" height="40" rx="11" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
    <text x="51" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle">← Back</text>

    <rect x="114" y="0" width="298" height="40" rx="11" fill="url(#cta)"/>
    <text x="263" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">Validate Step &amp; Continue →</text>
  </g>
</svg>
